<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Early Warning Admin</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f4f6f8; margin: 0; display: grid; place-items: center; min-height: 100vh; }
  .card { background: #fff; padding: 28px; border-radius: 10px; max-width: 420px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: #444; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>Admin sign-in has moved</h1>
  <p>Message <b>admin</b> to the WhatsApp bot from an authorised number. It replies with a single-use sign-in link. Nothing needs to be typed or pasted.</p>
</div>
</body>
</html>
